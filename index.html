<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
  <title>鹈鹕骑单车 · Pelican Ride 3D</title>
  <meta name="description" content="一只鹈鹕骑着复古单车穿越无尽的田野 —— Three.js 实时渲染、程序化建模、昼夜循环与合成音效。" />
  <meta name="theme-color" content="#0e1a2b" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%9A%B2%3C/text%3E%3C/svg%3E" />
  <link rel="stylesheet" href="./css/style.css" />
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <symbol id="pelicanLogo" viewBox="0 0 120 120">
        <!-- body -->
        <ellipse cx="50" cy="78" rx="30" ry="24" fill="#fbf8f2" />
        <path d="M24 82 q-10 4 -16 14 q14 -2 22 -6z" fill="#fbf8f2" />
        <!-- wing -->
        <path d="M34 70 q22 -10 40 4 q-6 16 -30 16 q-10 -2 -10 -20z" fill="#e9e4da" />
        <path d="M44 88 q14 2 28 -6 l-4 10 q-12 6 -24 4z" fill="#22232a" />
        <!-- neck & head -->
        <path d="M62 62 q-8 -18 2 -32 q10 -12 22 -4 q-10 2 -12 14 q-2 12 2 24z" fill="#fbf8f2" />
        <circle cx="80" cy="30" r="11" fill="#fbf8f2" />
        <circle cx="83" cy="27" r="3.4" fill="#f6c27a" />
        <circle cx="83.6" cy="27" r="1.8" fill="#151515" />
        <!-- bill + pouch -->
        <path d="M86 32 L118 52 q1 3 -3 3 L84 38z" fill="#f9c94e" />
        <path d="M84 38 L114 54 q-10 14 -24 6 q-8 -6 -6 -22z" fill="#f6a568" />
        <circle cx="117" cy="53" r="2" fill="#e2553a" />
      </symbol>
    </defs>
  </svg>

  <div id="app"></div>

  <!-- Letterbox bars for cinematic mode -->
  <div class="letterbox top"></div>
  <div class="letterbox bottom"></div>

  <!-- Loader -->
  <div id="loader" role="status" aria-live="polite">
    <div class="ld-inner">
      <div class="ld-icon">
        <svg viewBox="0 0 120 120"><use href="#pelicanLogo" /></svg>
        <div class="ld-wheel"></div>
      </div>
      <div class="ld-title">鹈鹕骑单车</div>
      <div class="ld-tip">正在给轮胎打气、给鹈鹕梳羽毛…</div>
      <div class="ld-bar"><i></i></div>
    </div>
  </div>

  <div id="hud">
    <header class="panel brand">
      <svg class="logo" viewBox="0 0 120 120" aria-hidden="true"><use href="#pelicanLogo" /></svg>
      <div>
        <h1>鹈鹕骑单车</h1>
        <p>Pelican on a Bicycle · 实时 3D</p>
      </div>
    </header>

    <section class="panel stats" aria-label="骑行数据">
      <div class="gauge">
        <svg viewBox="0 0 120 120" aria-hidden="true">
          <defs>
            <linearGradient id="gGrad" x1="0" x2="1" y1="1" y2="0">
              <stop offset="0" stop-color="#4fd1c5" />
              <stop offset="0.6" stop-color="#ffd166" />
              <stop offset="1" stop-color="#ff6b4a" />
            </linearGradient>
          </defs>
          <g transform="rotate(150 60 60)">
            <circle cx="60" cy="60" r="48" class="g-track" pathLength="360" stroke-dasharray="240 360" />
            <circle id="arcVal" cx="60" cy="60" r="48" class="g-val" />
          </g>
          <g class="g-ticks">
            <line x1="60" y1="8" x2="60" y2="15" transform="rotate(-120 60 60)" />
            <line x1="60" y1="8" x2="60" y2="15" transform="rotate(-80 60 60)" />
            <line x1="60" y1="8" x2="60" y2="15" transform="rotate(-40 60 60)" />
            <line x1="60" y1="8" x2="60" y2="15" />
            <line x1="60" y1="8" x2="60" y2="15" transform="rotate(40 60 60)" />
            <line x1="60" y1="8" x2="60" y2="15" transform="rotate(80 60 60)" />
            <line x1="60" y1="8" x2="60" y2="15" transform="rotate(120 60 60)" />
          </g>
          <g id="needle" class="g-needle">
            <path d="M58.5 60 L60 20 L61.5 60z" />
            <circle cx="60" cy="60" r="4.5" />
          </g>
        </svg>
        <div class="gauge-val"><b id="spd">0</b><span>km/h</span></div>
      </div>
      <ul class="kv">
        <li><span>踏频</span><b id="cad">0</b><em>rpm</em></li>
        <li><span>里程</span><b id="dist">0.00</b><em>km</em></li>
        <li><span>时刻</span><b id="clock">16:36</b><em id="sunIcon">☀️</em></li>
        <li class="fishrow"><span>吃到的鱼</span><b id="fish">0</b><em>🐟</em></li>
      </ul>
    </section>

    <nav class="panel dock" aria-label="控制面板">
      <div class="actions">
        <button data-act="fish" title="把一条鱼抛向鹈鹕 (F)"><i>🐟</i><span>抛鱼</span><kbd>F</kbd></button>
        <button data-act="bell" title="按车铃 (B)"><i>🔔</i><span>车铃</span><kbd>B</kbd></button>
        <button data-act="honk" title="鹈鹕叫一声 (H)"><i>📣</i><span>叫一声</span><kbd>H</kbd></button>
        <button data-act="wave" title="挥翅膀打招呼 (W)"><i>👋</i><span>挥翅</span><kbd>W</kbd></button>
        <button data-act="jump" title="兔子跳 (空格)"><i>⤴️</i><span>跳跃</span><kbd>␣</kbd></button>
        <button data-act="photo" title="保存截图 (P)"><i>📸</i><span>拍照</span><kbd>P</kbd></button>
      </div>
      <div class="sliders">
        <label><span>速度</span><input type="range" id="spdR" min="0" max="60" value="22" aria-label="速度" /><output id="spdO">22</output><em>km/h</em></label>
        <label><span>时间</span><input type="range" id="timeR" min="0" max="23.99" step="0.01" value="16.6" aria-label="时间" /><output id="timeO">16:36</output></label>
      </div>
      <div class="row">
        <div class="seg" role="group" aria-label="镜头">
          <button data-cam="cinematic" title="电影镜头 (1)">🎬 电影</button>
          <button data-cam="orbit" title="自由环绕 (2)">🔄 环绕</button>
          <button data-cam="chase" title="跟随 (3)">🚴 跟随</button>
          <button data-cam="side" title="侧面 (4)">↔️ 侧面</button>
        </div>
        <div class="toggles">
          <button class="tog" id="tCycle" title="昼夜循环 (N)">🌗 昼夜</button>
          <button class="tog" id="tSound" title="音效">🔊 音效</button>
          <button class="tog" id="tMusic" title="音乐 (M)">🎵 音乐</button>
          <button class="tog" id="tFx" title="后期特效：辉光 / 暗角 / 胶片颗粒">✨ 特效</button>
        </div>
      </div>
    </nav>

    <aside class="panel keys" id="keys">
      <button id="keysToggle" class="keys-head" aria-label="快捷键">⌨️ 快捷键</button>
      <ul>
        <li><kbd>←</kbd><kbd>→</kbd> 变道</li>
        <li><kbd>↑</kbd><kbd>↓</kbd> 加速 / 减速</li>
        <li><kbd>1</kbd>–<kbd>4</kbd> 切换镜头</li>
        <li><kbd>U</kbd> 隐藏界面</li>
        <li>拖拽 旋转 · 滚轮 缩放</li>
      </ul>
    </aside>

    <div id="fps"></div>
  </div>
  <div id="toasts" aria-live="polite"></div>
  <div id="hint">🔊 点击画面开启声音 · 拖拽旋转视角</div>
  <div id="flash"></div>

  <noscript>需要启用 JavaScript 才能看到骑车的鹈鹕 🐦🚲</noscript>
  <script type="module" src="./js/main.js"></script>
</body>
</html>
